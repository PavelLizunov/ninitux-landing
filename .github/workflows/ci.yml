name: ci

# Lints and type-checks the source, builds the same Docker image that runs in
# production, starts it and drives the page in a real browser (scripts/e2e.mjs).
# The screenshots of that run are kept as the artifact "screenshots".

on:
  push:
    branches: [main, feat/nextjs-v4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.x" # the version of the Dockerfile

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Build the production image
        run: docker build -t ninitux-landing:ci .

      - name: Start the site
        run: |
          docker run -d --name site -p 127.0.0.1:3000:3000 ninitux-landing:ci
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/

      - name: End-to-end check in a browser
        run: bun run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Server log
        if: always()
        run: docker logs site 2>&1 | tail -n 60

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: e2e-out
          if-no-files-found: warn
          retention-days: 30
